# ============================================
# CloudWise AI — Secure Docker Compose (Production)
# ============================================
version: "3.9"

# ─── Define Secrets ─────────────────────────
secrets:
  postgres_user:
    file: ./secrets/postgres_user.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt

# ─── Define Networks ────────────────────────
networks:
  internal:
    driver: bridge
  frontend-net:
    driver: bridge

# ─── Services ──────────────────────────────
services:

  # ─── PostgreSQL ──────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cloudwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudwise_db
    secrets:
      - postgres_user
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/postgres_user) -d cloudwise_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cloudwise-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "$(cat /run/secrets/redis_password)"]
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$(cat /run/secrets/redis_password)", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Backend (FastAPI) ───────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudwise-backend
    restart: unless-stopped
    env_file: .env  # Only non-secret configs
    environment:
      DATABASE_URL: postgresql+asyncpg://$(cat /run/secrets/postgres_user):$(cat /run/secrets/postgres_password)@postgres:5432/cloudwise_db
      REDIS_URL: redis://:$(cat /run/secrets/redis_password)@redis:6379/0
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - upload_data:/app/uploads
    networks:
      - internal
      - frontend-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Frontend (Next.js) ──────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://backend:8000
    container_name: cloudwise-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://backend:8000
    ports:
      - "443:443"  # HTTPS
    depends_on:
      - backend
    networks:
      - frontend-net

# ─── Volumes ──────────────────────────────
volumes:
  postgres_data:
  redis_data:
  upload_data:
